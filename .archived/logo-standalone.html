<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Supported Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Transparent background for screenshot */
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 40px;
            /* Pill shape with 60% opacity mint green */
            background: rgba(240, 253, 250, 0.6);
            border-radius: 9999px;
        }

        .sparkles {
            font-size: 28px;
            margin-bottom: 16px;
            /* mt-4 equivalent */
        }

        .badge {
            display: block;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <span class="sparkles">* ✨</span>
        <img class="badge" src="https://img.shields.io/badge/*_%E2%9C%A8_AI_Supported-Human_Verified-14b8a6"
            alt="* ✨ AI Supported - Human Verified">
    </div>
</body>

</html>
